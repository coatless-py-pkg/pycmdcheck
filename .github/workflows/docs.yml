name: Docs

on:
  push:
    branches: [main]
  # A pull request builds the site and stops there. A push to main deploys,
  # and so does a run started by hand on main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Runs that can deploy share the "pages" group and wait for each other, so
  # a deploy that has started is never cancelled. A pull request builds in a
  # group of its own, where a newer push replaces the build before it.
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group docs
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
      - name: Build the API reference
        # Writes docs/reference/ from the docstrings, then fetches the list of
        # Python standard library pages that the reference links to.
        working-directory: docs
        run: |
          uv run quartodoc build
          uv run quartodoc interlinks
      - name: Render the site
        working-directory: docs
        run: quarto render
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write  # Needed to publish the site
      id-token: write  # Lets GitHub Pages confirm where the site was built
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
