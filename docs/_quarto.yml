project:
  type: website
  output-dir: _site

website:
  title: pycmdcheck
  description: Python package quality checker inspired by R CMD check
  navbar:
    left:
      - text: Getting Started
        href: getting-started.qmd
      - text: Command Line
        href: cli.qmd
      - text: Configuration
        href: configuration.qmd
      - text: Rule Codes
        href: rules.qmd
      - text: Untrusted Code
        href: triage.qmd
      - text: AI Assistant
        href: assistants.qmd
      - text: Custom Checks
        href: custom-checks.qmd
      - text: API Reference
        href: reference/index.qmd
      - text: Changelog
        href: changelog.qmd
      - text: Blog posts
        href: https://blog.thecoatlessprofessor.com/projects/pycmdcheck/
    right:
      - icon: github
        href: https://github.com/coatless-py-pkg/pycmdcheck

format:
  html:
    theme: cosmo
    toc: true

filters:
  - interlinks

interlinks:
  sources:
    python:
      url: https://docs.python.org/3/

quartodoc:
  style: pkgdown
  parser: google
  dir: reference
  package: pycmdcheck
  render_interlinks: true
  renderer:
    style: markdown
    table_style: description-list
  title: API Reference
  sidebar: reference/_sidebar.yml
  sections:
    - title: Main API
      desc: Core functions and classes for using pycmdcheck
      contents:
        - check
        - CheckResult
        - CheckStatus
        - Finding
        - Report
        - results.most_severe
    - title: Check Protocol
      desc: Base classes for implementing custom checks
      contents:
        - checks.base.Check
        - checks.base.BaseCheck
    - title: Built-in Checks
      desc: The 20 built-in check implementations
      contents:
        - checks.build.BuildCheck
        - checks.changelog.ChangelogCheck
        - checks.ci.CICheck
        - checks.citation.CitationCheck
        - checks.community.CommunityCheck
        - checks.dependencies.DependenciesCheck
        - checks.docs.DocsCheck
        - checks.doctests.DoctestsCheck
        - checks.formatting.FormattingCheck
        - checks.license.LicenseCheck
        - checks.linting.LintingCheck
        - checks.metadata.MetadataCheck
        - checks.py_typed.PyTypedCheck
        - checks.python_versions.PythonVersionsCheck
        - checks.structure.StructureCheck
        - checks.test_suite.TestSuiteCheck
        - checks.tests.TestsCheck
        - checks.typing.TypingCheck
        - checks.urls.URLsCheck
        - checks.version.VersionCheck
    - title: Deprecated Checks
      desc: Kept for one release. A deprecated check is always skipped.
      contents:
        - checks.imports.ImportsCheck
    - title: Profiles
      desc: Named sets of checks and the options they set
      contents:
        - profiles.Profile
        - profiles.get_profile
        - profiles.list_profiles
        - profiles.apply_profile
    - title: Runner & Discovery
      desc: Advanced API for running checks programmatically
      contents:
        - runner.run_checks
        - discovery.discover_checks
        - discovery.list_available_checks
    - title: Configuration
      desc: Configuration loading utilities
      contents:
        - config.load_config
        - config.get_check_config
        - config.is_check_enabled
        - config.validate_config
